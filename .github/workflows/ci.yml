name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least-privilege default for GITHUB_TOKEN: this workflow only checks out code,
# installs dependencies, and runs tests/lint/build - it never needs to write to
# issues, PRs, packages, or anything else. Flagged by CodeQL
# (actions/missing-workflow-permissions) since an unset permissions block
# inherits the repo's default token scope, which can be broader than this needs.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Two separate invocations: requirements.lock.txt is hash-pinned
          # (--generate-hashes), and pip's hash-checking mode is triggered by the
          # mere presence of any hash and then demands hashes + exact "==" pins for
          # every requirement in the *same* install command - including
          # requirements-dev.txt's unpinned/unhashed dev tools if combined here.
          pip install -r requirements.lock.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.3.0"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (eslint)
        run: npx eslint app/

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build
