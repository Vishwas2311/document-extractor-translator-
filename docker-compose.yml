services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      PROJECT_ROOT: /app
    ports:
      # Loopback-only: do not expose the unauthenticated-looking API on all interfaces.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped
