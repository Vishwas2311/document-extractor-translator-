[project]
name = "document-intelligence-platform-backend"
version = "0.1.0"
description = "Python backend for Azure document extraction and translation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `python -m pytest` adds the CWD to sys.path automatically; the bare `pytest`
# console script (what CI runs) does not, so "import app" fails without this.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiofiles", "aiofiles.*"]
ignore_missing_imports = true
